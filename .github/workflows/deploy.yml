name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm cú pháp, file thiếu, IP/secret lộ
        run: bash scripts/check.sh

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy lên VPS (key chỉ chạy được /usr/local/bin/hoc-deploy)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "root@$HOST" deploy
      - name: Kiểm trang đã lên đúng commit
        run: |
          v=$(echo "$GITHUB_SHA" | cut -c1-7)
          for p in "" aws/ cloudflare/; do
            url="https://bai.phuoc-review-app-1.uk/hoc/$p"
            body=$(curl -fsS "$url")
            if [ -n "$p" ]; then echo "$body" | grep -q "app.js?v=$v" || { echo "$url chưa có bản $v"; exit 1; }; fi
            echo "OK $url"
          done
